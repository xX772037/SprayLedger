# Weekly update checks. Covers the npm packages in package.json and the actions used in
# .github/workflows. The libraries bundled in vendor/ (Leaflet, jsPDF, fonts) are updated by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
